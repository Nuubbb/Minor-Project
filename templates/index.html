<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surveillance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Subtle animated background grid */
        
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(37, 99, 235, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(60px, 60px);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse-soft {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
        
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            animation: fadeInUp 0.7s ease-out;
        }
        /* Brand header */
        
        .brand {
            text-align: center;
            margin-bottom: 36px;
        }
        
        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin-bottom: 18px;
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.25);
            animation: float 4s ease-in-out infinite;
        }
        
        .brand h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: 2px;
        }
        
        .brand p {
            color: #64748b;
            font-size: 0.88rem;
            margin-top: 6px;
        }
        /* Card */
        
        .portal-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }
        
        .portal-card h2 {
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }
        
        .portal-card .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.82rem;
            margin-bottom: 30px;
        }
        /* Portal buttons */
        
        .portal-grid {
            display: flex;
            gap: 16px;
        }
        
        .portal-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 30px 16px;
            border-radius: 12px;
            text-decoration: none;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        
        .portal-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .portal-btn .icon-circle {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.3s ease;
        }
        
        .portal-btn .label {
            font-size: 0.95rem;
            font-weight: 700;
        }
        
        .portal-btn .desc {
            font-size: 0.72rem;
            text-align: center;
            line-height: 1.4;
        }
        /* Operator button */
        
        .portal-btn.operator {
            color: #1e40af;
        }
        
        .portal-btn.operator .icon-circle {
            background: rgba(37, 99, 235, 0.1);
            color: #2563eb;
        }
        
        .portal-btn.operator:hover {
            border-color: #2563eb;
            background: rgba(37, 99, 235, 0.03);
        }
        
        .portal-btn.operator:hover .icon-circle {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        
        .portal-btn.operator .desc {
            color: #64748b;
        }
        /* Admin button */
        
        .portal-btn.admin {
            color: #1e293b;
        }
        
        .portal-btn.admin .icon-circle {
            background: rgba(15, 23, 42, 0.08);
            color: #1e293b;
        }
        
        .portal-btn.admin:hover {
            border-color: #1e293b;
            background: rgba(15, 23, 42, 0.02);
        }
        
        .portal-btn.admin:hover .icon-circle {
            background: #1e293b;
            color: white;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.3);
        }
        
        .portal-btn.admin .desc {
            color: #64748b;
        }
        /* Footer */
        
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: #94a3b8;
            animation: pulse-soft 3s ease-in-out infinite;
        }
        
        .footer-note i {
            margin-right: 4px;
        }
        
        @media (max-width: 480px) {
            .portal-grid {
                flex-direction: column;
            }
            .portal-card {
                padding: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-shield-halved"></i></div>
            <h1>SURVEILLANCE SYSTEM</h1>
            <p>Real-Time Monitoring &amp; Security</p>
        </div>

        <div class="portal-card">
            <h2>Select Login Portal</h2>
            <p class="subtitle">Choose your designated workspace to access the network</p>

            <div class="portal-grid">
                <a href="{{ url_for('login', role_type='operator') }}" class="portal-btn operator">
                    <div class="icon-circle"><i class="fas fa-desktop"></i></div>
                    <span class="label">Operator Desk</span>
                    <span class="desc">Monitor feeds &amp; manage alerts</span>
                </a>

                <a href="{{ url_for('login', role_type='admin') }}" class="portal-btn admin">
                    <div class="icon-circle"><i class="fas fa-user-shield"></i></div>
                    <span class="label">System Admin</span>
                    <span class="desc">Full system control &amp; configuration</span>
                </a>
            </div>
        </div>

        <p class="footer-note"><i class="fas fa-lock"></i> Secured access — Authorized personnel only</p>
    </div>
</body>

</html>
